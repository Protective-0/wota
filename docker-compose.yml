services:
  discord-bot:
    build: .
    image: discord-bot:latest
    container_name: discord_media_bot
    restart: always
    shm_size: '2gb'
    mem_limit: 2g
    cpus: '2.0'
    env_file:
      - .env
    environment:
      - BROWSER_HEADED=false
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./temp_media:/app/temp_media
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; exit(0)'"]
      interval: 60s
      timeout: 10s
      retries: 3

