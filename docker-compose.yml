services:
  discord-bot:
    build: .
    image: discord-bot:latest
    container_name: discord_media_bot
    restart: unless-stopped
    shm_size: '2gb'
    mem_limit: 2g
    cpus: '2.0'
    env_file:
      - .env
    environment:
      - BROWSER_HEADED=false
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./temp_media:/app/temp_media
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import sqlite3, os; exit(0 if os.path.exists(\"./bot.py\") else 1)'"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

